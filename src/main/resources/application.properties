spring.application.name=drugwatch
# openFDA
openfda.base-url=https://api.fda.gov

# Jev (public demo needs no key)
jev.base-url=https://simple-jev-demo-api.featherless.ai
jev.model=featherless-ai/Qwen3.6-35B-A3B-classifier
jev.api-key=${JEV_API_KEY:}

# Database (H2, saved to a local file)
spring.datasource.url=jdbc:h2:file:./data/drugwatch
spring.jpa.hibernate.ddl-auto=update